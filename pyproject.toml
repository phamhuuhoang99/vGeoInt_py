[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vgeoint"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
# Real model runs: `pixi run pytest -m slow`
markers = ["slow: runs a real AI model in the ai environment (minutes)"]
addopts = "-m \"not slow\""
