[workspace]
name = "vgeoint"
version = "0.1.0"
description = "vGeoInt — GIS desktop suite (PyQGIS rewrite)"
channels = ["conda-forge"]
# Two platforms: "win-64" for the GUI environments, "win-64-cuda" (the CUDA 12 virtual package) so that the
# solver takes the CUDA build of PyTorch for the ai environment on any machine; it still runs on CPU-only
# machines (vgeoint.ai.scripts._device).
platforms = ["win-64", { name = "win-64-cuda", platform = "win-64", cuda = "12" }]

# ---------------------------------------------------------------- GUI (default)
[dependencies]
python = "3.14.*"
qgis = ">=4.2,<4.3"
opencv = "*"
numpy = "*"
psycopg = "*"

[pypi-dependencies]
vgeoint = { path = ".", editable = true }

[tasks]
app = { cmd = "python -m vgeoint.app", depends-on = ["build-resources"] }
catalog = "python -m vgeoint.catalog"
engine = "python -m vgeoint.engine"
build-resources = "python tools/build_resources.py"
check-env = { cmd = "python tools/check_env.py", depends-on = ["build-resources"] }
db-up = "python tools/db_docker.py up"
db-down = "python tools/db_docker.py down"

# ---------------------------------------------------------------- tests
[feature.gui]
platforms = ["win-64"]

[feature.test.dependencies]
pytest = "*"
pytest-qt = "*"
pytest-timeout = "*"

[feature.test.tasks]
test = "pytest -q"

# ---------------------------------------------------------------- AI scripts
# Separate interpreter: the GUI launches these scripts as subprocesses.
[feature.ai]
# PyTorch built for CUDA 12.8: runs on NVIDIA GPUs from Maxwell (GTX 900) to Blackwell (RTX 50) with a
# driver >= 528; the CUDA libraries come with the package. Without a usable GPU the scripts fall back to
# the CPU (vgeoint.ai.scripts._device). CUDA 13 builds were not taken: they drop GPUs older than RTX 20
# and need driver >= 580.
dependencies = { python = "3.12.*", pytorch = { version = "2.13.*", build = "cuda128*" }, torchvision = { version = "*", build = "cuda128*" }, cuda-version = "12.8.*", scikit-learn = "1.7.*", joblib = "*", rasterio = "*", geopandas = "*", shapely = "*", pyproj = "*", opencv = "*", scipy = "*", pandas = "*", matplotlib-base = "*", pillow = "*", requests = "*", onnxruntime = "*", earthengine-api = "*" }
pypi-dependencies = { ultralytics = "*", sahi = "*", segmentation-models-pytorch = "*", motmetrics = "*" }
platforms = ["win-64-cuda"]

[environments]
default = { features = ["gui", "test"], solve-group = "gui" }
ai = { features = ["ai"], no-default-feature = true }
# What the installer ships: the GUI env without test tools, same versions as `default`.
runtime = { features = ["gui"], solve-group = "gui" }
package = { features = ["package"], no-default-feature = true }

# ---------------------------------------------------------------- packaging
[feature.package]
platforms = ["win-64"]

[feature.package.dependencies]
python = "3.12.*"
pixi-pack = "0.7.*"
pixi-unpack = "0.7.*"

[feature.package.tasks]
package = "python packaging/build.py"
