<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background base image -->
    <rect x="2" y="6" width="8" height="6" rx="1" fill="#e0e0e0" stroke="#666" stroke-width="1"/>

    <!-- Panchromatic (PAN) image - high resolution grayscale -->
    <rect x="14" y="2" width="8" height="8" rx="1" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
    <text x="18" y="7.5" font-family="Arial, sans-serif" font-size="3" font-weight="bold" fill="#333" text-anchor="middle">PAN</text>

    <!-- Multispectral (MS) image - lower resolution color -->
    <rect x="2" y="14" width="6" height="6" rx="1" fill="#4caf50" stroke="#2e7d32" stroke-width="1"/>
    <rect x="3" y="15" width="1.5" height="1.5" fill="#f44336"/>
    <rect x="5" y="15" width="1.5" height="1.5" fill="#2196f3"/>
    <rect x="3" y="17" width="1.5" height="1.5" fill="#ff9800"/>
    <rect x="5" y="17" width="1.5" height="1.5" fill="#9c27b0"/>
    <text x="5" y="13" font-family="Arial, sans-serif" font-size="2.5" font-weight="bold" fill="#2e7d32" text-anchor="middle">MS</text>

    <!-- Fusion/blending arrows -->
    <path d="M 10 9 Q 12 8 14 6" stroke="#ff6b35" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 8 14 Q 10 13 12 11" stroke="#ff6b35" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Result image - pansharpened -->
    <rect x="14" y="14" width="8" height="8" rx="1" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
    <rect x="15" y="15" width="1.5" height="1.5" fill="#e57373"/>
    <rect x="17" y="15" width="1.5" height="1.5" fill="#64b5f6"/>
    <rect x="19" y="15" width="1.5" height="1.5" fill="#ffb74d"/>
    <rect x="15" y="17" width="1.5" height="1.5" fill="#ba68c8"/>
    <rect x="17" y="17" width="1.5" height="1.5" fill="#4db6ac"/>
    <rect x="19" y="17" width="1.5" height="1.5" fill="#aed581"/>
    <rect x="15" y="19" width="1.5" height="1.5" fill="#f06292"/>
    <rect x="17" y="19" width="1.5" height="1.5" fill="#90caf9"/>
    <rect x="19" y="19" width="1.5" height="1.5" fill="#ffcc02"/>

    <!-- Plus symbol indicating fusion -->
    <circle cx="12" cy="12" r="3" fill="#ffffff" stroke="#ff6b35" stroke-width="2"/>
    <path d="M 10 12 L 14 12 M 12 10 L 12 14" stroke="#ff6b35" stroke-width="2"/>

    <!-- Arrow marker definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7"
                refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b35"/>
        </marker>
    </defs>
</svg>
